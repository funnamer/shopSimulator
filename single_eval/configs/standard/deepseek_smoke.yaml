env_config:
  base_url: http://127.0.0.1:5000

agent_config:
  model_name: deepseek-v4-flash
  source: deepseek
  model_key_env: DEEPSEEK_API_KEY
  base_url_env: DEEPSEEK_BASE_URL
  thinking: disabled
  max_tokens: 512
  system_prompt: |
    你正在进行网上购物。每一轮只能执行一个动作。
    必须通过提供的 search 或 click 工具执行动作，不要用文本模拟工具调用。
    click 的 value 必须严格来自当前可点击按钮列表。
    在点击购买前，必须至少选择一个商品规格。
  task_nums: 3
  output_path: outputs/test_tool3
